<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Arcade — Games for Everyone</title>
  <meta name="description" content="Step into an offline-ready arcade with pool, air hockey, board games, cards, puzzles, and party games. Play together on one device.">
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/board-games.css">
  <link rel="stylesheet" href="css/catan.css">
  <link rel="stylesheet" href="css/physical-games.css">
  <link rel="stylesheet" href="css/card-games.css">
  <link rel="stylesheet" href="css/multiplayer.css">
</head>
<body>
  <header class="app-header">
    <button class="brand" data-nav="back" type="button" aria-label="Arcade home" title="Return to the arcade home page">
      <img src="assets/logo.svg" class="brand-icon" alt="" width="42" height="42">
      <span class="brand-lockup"><span class="brand-kicker">INSERT FUN</span><span class="brand-title">ARCADE<span class="brand-spark">✦</span></span></span>
    </button>
    <div class="header-actions">
      <button id="roomToggle" class="icon-btn room-toggle" aria-label="Open multiplayer lobby" title="Open multiplayer room" type="button">
        <span class="ui-glyph" aria-hidden="true" style="--icon-url:url('../assets/icons/tabler/users.svg')"></span>
        <span class="header-action-label">Room</span>
      </button>
      <div class="header-setting">
        <button id="feedbackToggle" class="icon-btn" aria-label="Sound and vibration settings" aria-expanded="false" aria-controls="feedbackPanel" title="Set sound and vibration" type="button">
          <span class="ui-glyph" aria-hidden="true" style="--icon-url:url('../assets/icons/tabler/volume-2.svg')"></span>
          <span class="header-action-label">Sound<span class="feedback-label-extra"> & feel</span></span>
        </button>
        <div id="feedbackPanel" class="feedback-panel" role="group" aria-label="Sound and vibration settings" hidden>
          <h2>Sound & feel</h2>
          <p>Choose how your games respond to taps.</p>
          <button id="soundToggle" class="feedback-option" type="button" aria-pressed="true" title="Turn game sounds on or off"><span class="feedback-option-label"><span class="ui-glyph" aria-hidden="true" style="--icon-url:url('../assets/icons/tabler/volume-2.svg')"></span>Game sounds</span><span class="feedback-value">On</span></button>
          <button id="soundTest" class="feedback-option" type="button" title="Play a sample sound to check your device"><span class="feedback-option-label"><span class="ui-glyph" aria-hidden="true" style="--icon-url:url('../assets/icons/tabler/volume-2.svg')"></span>Test sound</span></button>
          <p id="soundStatus" role="status" class="feedback-audio-status"></p>
          <button id="hapticsToggle" class="feedback-option" type="button" aria-pressed="false" title="Turn vibration on or off"><span class="feedback-option-label"><span class="ui-glyph" aria-hidden="true" style="--icon-url:url('../assets/icons/tabler/device-mobile-vibration.svg')"></span>Vibration</span><span class="feedback-value">Off</span></button>
        </div>
      </div>
      <button id="themeToggle" class="icon-btn theme-toggle" aria-label="Theme: Auto. Select Light" title="Theme: Auto (follows your device). Select Light" type="button">
        <svg class="icon sun-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0-5a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0V3a1 1 0 0 1 1-1zm0 17a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0v-2a1 1 0 0 1 1-1zm9-9a1 1 0 1 1 0 2h-2a1 1 0 1 1 0-2zM5 12a1 1 0 1 1 0 2H3a1 1 0 1 1 0-2zm13.07-6.07a1 1 0 0 1 0 1.42l-1.42 1.41a1 1 0 1 1-1.41-1.41l1.41-1.42a1 1 0 0 1 1.42 0zM7.76 16.24a1 1 0 0 1 0 1.41l-1.42 1.42a1 1 0 1 1-1.41-1.42l1.41-1.41a1 1 0 0 1 1.42 0zM16.24 7.76a1 1 0 0 1 1.41 0l1.42 1.41a1 1 0 1 1-1.42 1.41l-1.41-1.41a1 1 0 0 1 0-1.41zM6.24 6.24a1 1 0 0 1 1.41 0l1.42 1.41a1 1 0 1 1-1.42 1.41L6.24 7.65a1 1 0 0 1 0-1.41z"/></svg>
        <svg class="icon moon-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <span class="theme-label">Theme: </span><span id="themeMode">Auto</span>
      </button>
    </div>
  </header>

  <main class="main-content">
    <div id="game-stage" class="stage-root"></div>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
