<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Arcade">
  <defs>
    <linearGradient id="stick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a4a"/>
      <stop offset="1" stop-color="#ff2e88"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#ffd9a8"/>
      <stop offset="0.45" stop-color="#ff7a18"/>
      <stop offset="1" stop-color="#ff2e88"/>
    </radialGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#333c4f"/>
      <stop offset="1" stop-color="#1c212c"/>
    </linearGradient>
    <radialGradient id="badgeBg" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#181c26"/>
      <stop offset="1" stop-color="#0a0c11"/>
    </radialGradient>
    <filter id="dropShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#05060a" flood-opacity="0.55"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <clipPath id="badgeClip"><circle cx="32" cy="32" r="27.5"/></clipPath>
  </defs>

  <g filter="url(#dropShadow)">
    <!-- Outer badge -->
    <circle cx="32" cy="32" r="29" fill="url(#badgeBg)"/>

    <!-- Sunburst rays, clipped to the badge interior -->
    <g clip-path="url(#badgeClip)" opacity="0.55">
      <path d="M46.96 30.90 L59.00 32.00 L46.96 33.10 Z" fill="#ff2e88"/>
      <path d="M46.24 36.71 L56.94 42.33 L45.40 38.74 Z" fill="#ff7a18"/>
      <path d="M43.35 41.80 L51.09 51.09 L41.80 43.35 Z" fill="#fbbf24"/>
      <path d="M38.74 45.40 L42.33 56.94 L36.71 46.24 Z" fill="#34d399"/>
      <path d="M33.10 46.96 L32.00 59.00 L30.90 46.96 Z" fill="#38bdf8"/>
      <path d="M27.29 46.24 L21.67 56.94 L25.26 45.40 Z" fill="#a855f7"/>
      <path d="M22.20 43.35 L12.91 51.09 L20.65 41.80 Z" fill="#ff2e88"/>
      <path d="M18.60 38.74 L7.06 42.33 L17.76 36.71 Z" fill="#ff7a18"/>
      <path d="M17.04 33.10 L5.00 32.00 L17.04 30.90 Z" fill="#fbbf24"/>
      <path d="M17.76 27.29 L7.06 21.67 L18.60 25.26 Z" fill="#34d399"/>
      <path d="M20.65 22.20 L12.91 12.91 L22.20 20.65 Z" fill="#38bdf8"/>
      <path d="M25.26 18.60 L21.67 7.06 L27.29 17.76 Z" fill="#a855f7"/>
      <path d="M30.90 17.04 L32.00 5.00 L33.10 17.04 Z" fill="#ff2e88"/>
      <path d="M36.71 17.76 L42.33 7.06 L38.74 18.60 Z" fill="#ff7a18"/>
      <path d="M41.80 20.65 L51.09 12.91 L43.35 22.20 Z" fill="#fbbf24"/>
      <path d="M45.40 25.26 L56.94 21.67 L46.24 27.29 Z" fill="#34d399"/>
      <circle cx="32" cy="32" r="27.5" fill="#0a0c11" opacity="0.35"/>
    </g>

    <!-- Bold outline ring, echoes the arcade badge family look -->
    <circle cx="32" cy="32" r="27.5" fill="none" stroke="#f5f3ff" stroke-width="1.4" opacity="0.14"/>
    <circle cx="32" cy="32" r="29" fill="none" stroke="#05060a" stroke-width="2"/>

    <!-- Soft glow behind the ball -->
    <circle cx="32" cy="26" r="12" fill="url(#ball)" opacity="0.4" filter="url(#glow)"/>

    <!-- Control-panel base plate -->
    <rect x="13" y="42" width="38" height="15" rx="7.5" fill="url(#base)" stroke="#05060a" stroke-width="1.6"/>
    <rect x="13" y="42" width="38" height="5" rx="2.5" fill="#ffffff" opacity="0.07"/>
    <!-- corner rivets -->
    <circle cx="17.5" cy="49.5" r="1.3" fill="#05060a" opacity="0.6"/>
    <circle cx="46.5" cy="49.5" r="1.3" fill="#05060a" opacity="0.6"/>
    <!-- buttons -->
    <circle cx="24" cy="49.5" r="3.4" fill="#38bdf8" stroke="#05060a" stroke-width="1.2"/>
    <circle cx="32" cy="49.5" r="3.4" fill="#34d399" stroke="#05060a" stroke-width="1.2"/>
    <circle cx="40" cy="49.5" r="3.4" fill="#fbbf24" stroke="#05060a" stroke-width="1.2"/>
    <circle cx="23" cy="48.4" r="1" fill="#ffffff" opacity="0.5"/>
    <circle cx="31" cy="48.4" r="1" fill="#ffffff" opacity="0.5"/>
    <circle cx="39" cy="48.4" r="1" fill="#ffffff" opacity="0.5"/>

    <!-- Joystick shaft -->
    <rect x="29.3" y="28" width="5.4" height="19" rx="2.7" fill="url(#stick)" stroke="#05060a" stroke-width="1.2"/>

    <!-- Motion arcs, hinting the stick is in play -->
    <path d="M17 22 A19 19 0 0 1 22.5 12.5" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
    <path d="M47 22 A19 19 0 0 0 41.5 12.5" fill="none" stroke="#ff5a3c" stroke-width="2" stroke-linecap="round" opacity="0.55"/>

    <!-- Joystick ball -->
    <circle cx="32" cy="26" r="11.5" fill="url(#ball)" stroke="#05060a" stroke-width="1.8"/>
    <ellipse cx="27.2" cy="21" rx="3.8" ry="2.5" fill="#ffffff" opacity="0.5" transform="rotate(-25 27.2 21)"/>
    <ellipse cx="36.5" cy="30.5" rx="2.2" ry="1.3" fill="#ffffff" opacity="0.18" transform="rotate(-25 36.5 30.5)"/>
  </g>
</svg>
